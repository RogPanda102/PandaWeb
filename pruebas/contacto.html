<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de contacto</title>

    <!-- Bootstrap (para que se vea bonito) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">

        <div class="col-lg-6">

            <form action="#" method="post" class="php-email-form">

                <div class="row gy-4">

                    <div class="col-md-6">
                        <input type="text" name="name" class="form-control" placeholder="Nombre" required>
                    </div>

                    <div class="col-md-6">
                        <input type="email" name="email" class="form-control" placeholder="Correo electrónico" required>
                    </div>

                    <div class="col-md-12">
                        <input type="text" name="subject" class="form-control" placeholder="Asunto" required>
                    </div>

                    <div class="col-md-12">
                        <textarea name="message" rows="6" class="form-control" placeholder="Mensaje" required></textarea>
                    </div>

                    <div class="col-md-12 text-center">
                        <div class="loading d-none">Cargando</div>
                        <div class="error-message"></div>
                        <div class="sent-message d-none">
                            Su mensaje ha sido enviado. ¡Gracias!
                        </div>

                        <button type="submit" class="btn btn-primary mt-3">
                            Enviar mensaje
                        </button>
                    </div>

                </div>

            </form>

        </div>

    </div>
</div>

</body>
</html>
